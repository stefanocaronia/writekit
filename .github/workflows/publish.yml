name: Publish to npm

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run build
      - run: npm test
      # npm's Trusted Publisher for this workflow: no token, the job's OIDC identity publishes, with provenance.
      - run: npm publish --provenance --access public
